{% extends "auth_base.html" %}

{% block content %}

<div class="auth-card">
	<h2>Create Account</h2>
	<p class="auth-subtitle">Set up access to your AI surveillance dashboard.</p>

	<form method="POST">
		{% csrf_token %}
		<input class="form-control mb-3" type="text" name="username" placeholder="Username" required>
		<input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
		<input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
		<button class="btn btn-primary w-100" type="submit">Register</button>
	</form>

	<p class="auth-footer">Already have an account? <a href="/login/">Login</a></p>
</div>

{% endblock %}
