{% extends "auth_base.html" %}

{% block content %}

<div class="auth-card">
	<h2>Welcome Back</h2>
	<p class="auth-subtitle">Sign in to continue monitoring and reviewing activity detections.</p>

	<form method="POST">
		{% csrf_token %}
		<input class="form-control mb-3" name="username" placeholder="Username" required>
		<input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
		<button class="btn btn-primary w-100" type="submit">Login</button>
	</form>

	<p class="auth-footer">New user? <a href="/register/">Create an account</a></p>
</div>

{% endblock %}
