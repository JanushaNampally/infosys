{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<title>AI Surveillance Platform</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="wrapper">
	<nav class="sidebar">
		<h3 class="logo">AI Surveillance</h3>
		<ul>
			<li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
			<li><a href="/monitor/" class="{% if '/monitor/' in request.path %}active{% endif %}">Monitor</a></li>
			<li><a href="/history/" class="{% if '/history/' in request.path %}active{% endif %}">History</a></li>
			<li><a href="/settings/" class="{% if '/settings/' in request.path %}active{% endif %}">Settings</a></li>
			<li><a href="/profile/" class="{% if '/profile/' in request.path %}active{% endif %}">Profile</a></li>
			<li><a href="/logout/">Logout</a></li>
		</ul>
	</nav>

	<main class="main">
		<header class="topbar">
			<h4>AI Based Intelligent Surveillance System</h4>
		</header>
		<section class="content">
			{% block content %}
			{% endblock %}
		</section>
	</main>
</div>
</body>
</html>
